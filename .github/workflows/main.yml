name: WebForms CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Find solution file
      shell: cmd
      run: dir *.sln
    
    - name: Restore NuGet packages
      shell: cmd
      run: nuget restore *.sln
    
    - name: Build Solution
      shell: cmd
      run: msbuild *.sln /p:Configuration=Release
    
    - name: Find and run tests
      shell: cmd
      run: |
        echo Looking for test DLLs...
        dir /s *.Tests.dll
        if exist *.Tests.dll (
          echo Running tests...
          vstest.console.exe *.Tests.dll /Logger:trx
        ) else if exist **\*.Tests.dll (
          echo Running tests in subfolders...
          vstest.console.exe **\*.Tests.dll /Logger:trx
        ) else (
          echo No test DLLs found
        )
