name: WebForms CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: List files to debug
      run: dir /s *.sln
    
    - name: Restore NuGet packages
      run: nuget restore *.sln
    
    - name: Build Solution
      run: msbuild *.sln /p:Configuration=Release
    
    - name: Find and run tests
      run: |
        echo "Looking for test files..."
        dir /s *.Tests.dll
        if exist **\*.Tests.dll (
          echo "Running tests..."
          vstest.console.exe **\*.Tests.dll /Logger:trx
        ) else (
          echo "No test DLLs found - skipping tests"
        )
      shell: cmd
